<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacheKing Music - Full Audio & Video Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-red);
        }

        button.btn-search {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem 1.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* FULL PLAYER (YOUTUBE EMBED) */
        .player-card {
            display: none;
            background: rgba(22, 29, 47, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 0.85rem;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.25rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .player-meta {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .player-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .player-artist {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .player-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.2rem;
            border-radius: 0.65rem;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-mp3 {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .btn-mp3:hover {
            background: rgba(16, 185, 129, 0.25);
            transform: translateY(-2px);
        }

        .btn-yt {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
        }

        .btn-yt:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-2px);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.25rem;
        }

        .song-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .song-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .song-img-wrap {
            position: relative;
            width: 74px;
            height: 74px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .song-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-play-btn {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .song-card:hover .song-play-btn {
            opacity: 1;
        }

        .song-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .song-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-sub);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-album {
            color: var(--text-sub);
            font-size: 0.75rem;
            margin-top: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions-row {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.75rem;
        }

        .song-actions-row a {
            flex: 1;
            text-align: center;
            padding: 0.45rem 0.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
        }

        footer {
            margin-top: 3.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">
                <span>🎵 PacheKing Full Music & Video Station</span>
            </div>
            <h1>PacheKing Music</h1>
            <p class="subtitle">Busca canciones, reproduce la música COMPLETA y descárgala en MP3 de alta calidad</p>
        </header>

        <div class="search-card">
            <form id="search-form" class="search-group" onsubmit="handleSearch(event)">
                <input type="text" id="query-input" placeholder="Escribe el nombre de una canción o artista (ej: Calle 13, Bad Bunny, Coldplay)..." required autocomplete="off">
                <button type="submit" class="btn-search">
                    <span>Buscar</span>
                    <span>🔍</span>
                </button>
            </form>
        </div>

        <!-- FULL MUSIC & VIDEO PLAYER (YOUTUBE EMBED) -->
        <div id="player-card" class="player-card">
            <div class="video-wrapper">
                <iframe id="main-player-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="player-info-row">
                <div class="player-meta">
                    <div id="player-title" class="player-title">Canción</div>
                    <div id="player-artist" class="player-artist">Artista</div>
                </div>
                <div class="player-buttons">
                    <a id="btn-yt-full" href="#" target="_blank" class="btn-action btn-yt">
                        <span>▶ Abrir en YouTube</span>
                    </a>
                    <a id="btn-dl-full" href="#" target="_blank" class="btn-action btn-mp3">
                        <span>⬇️ Descargar MP3 Completo</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div id="results-grid" class="results-grid"></div>

        <footer>
            PacheKing Autonomous Station &bull; Canciones Completas &bull; Streaming Global
        </footer>
    </div>

    <script>
        function playFullSong(title, artist) {
            const playerCard = document.getElementById('player-card');
            const iframe = document.getElementById('main-player-iframe');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const ytBtn = document.getElementById('btn-yt-full');
            const dlBtn = document.getElementById('btn-dl-full');

            titleElem.innerText = title;
            artistElem.innerText = artist;

            const searchQuery = encodeURIComponent(`${title} ${artist}`);
            
            // Full music playback via YouTube embed search with autoplay
            iframe.src = `https://www.youtube.com/embed?listType=search&list=${searchQuery}&autoplay=1`;

            ytBtn.href = `https://www.youtube.com/results?search_query=${searchQuery}`;
            dlBtn.href = `https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${searchQuery}&f=mp3`;

            playerCard.style.display = 'block';
            playerCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.renderMusicResults = function(data) {
            const grid = document.getElementById('results-grid');
            if (!data.results || data.results.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones. Intenta con otra búsqueda.</div>';
                return;
            }

            grid.innerHTML = '';
            data.results.forEach(track => {
                const title = track.trackName || 'Sin título';
                const artist = track.artistName || 'Artista';
                const album = track.collectionName || '';
                const cover = (track.artworkUrl100 || '').replace('100x100bb', '300x300bb');
                const cleanQuery = encodeURIComponent(`${title} ${artist}`);

                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="song-top" onclick="playFullSong('${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}')">
                        <div class="song-img-wrap">
                            <img src="${cover}" alt="${title}" loading="lazy">
                            <div class="song-play-btn">▶</div>
                        </div>
                        <div class="song-meta">
                            <div class="song-name" title="${title}">${title}</div>
                            <div class="song-artist">${artist}</div>
                            <div class="song-album" title="${album}">${album}</div>
                        </div>
                    </div>
                    <div class="song-actions-row">
                        <a href="https://www.youtube.com/results?search_query=${cleanQuery}" target="_blank" class="btn-yt">YouTube ▶</a>
                        <a href="https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${cleanQuery}&f=mp3" target="_blank" class="btn-mp3">MP3 ⬇️</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Cargando catálogo musical... 🎶</div>';

            const oldScript = document.getElementById('jsonp-music-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-music-script';
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=24&callback=renderMusicResults`;
            script.onerror = function() {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error al conectar con el servidor de música. Intenta de nuevo.</div>';
            };
            document.body.appendChild(script);
        }

        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
    </script>
</body>
</html>
