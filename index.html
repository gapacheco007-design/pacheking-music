<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacheKing Music - Reproductor Completo Sin Bloqueos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* SEARCH BOX */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-purple);
        }

        button.btn-search {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem 1.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* REPRODUCTOR FLOTANTE COMPLETO */
        .sticky-player {
            display: none;
            background: rgba(22, 29, 47, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex: 1;
            min-width: 280px;
        }

        .track-art {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .track-meta {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .track-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
        }

        .track-artist {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .track-duration-tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-radius: 6px;
            padding: 0.15rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 0.25rem;
            width: fit-content;
        }

        audio {
            flex: 1.5;
            min-width: 290px;
            height: 48px;
            outline: none;
        }

        .btn-download-direct {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.3rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-download-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .card-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-art-box {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .card-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .track-card:hover .card-play-overlay {
            opacity: 1;
        }

        .card-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-song-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .card-artist-name {
            color: var(--text-sub);
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-duration {
            color: #34d399;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 0.35rem;
        }

        .card-actions-row {
            display: flex;
            gap: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.85rem;
        }

        .btn-card-action {
            flex: 1;
            text-align: center;
            padding: 0.55rem 0.2rem;
            border-radius: 7px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-play-card {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            color: #c084fc;
        }

        .btn-play-card:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        .btn-dl-card {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .btn-dl-card:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        footer {
            margin-top: 3.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">
                <span>🛡️ Red Corporativa: Audio Completo Sin YouTube</span>
            </div>
            <h1>PacheKing Music</h1>
            <p class="subtitle">Música COMPLETA (3 a 5 minutos) en streaming HTML5 directo y descarga sin bloqueos</p>
        </header>

        <!-- SEARCH BOX -->
        <div class="search-card">
            <form id="search-form" class="search-group" onsubmit="handleSearch(event)">
                <input type="text" id="query-input" placeholder="Escribe canción o artista (ej: Calle 13, Bad Bunny, Coldplay, Daft Punk)..." required autocomplete="off">
                <button type="submit" class="btn-search">
                    <span>Buscar</span>
                    <span>🔍</span>
                </button>
            </form>
        </div>

        <!-- FULL AUDIO STREAMING PLAYER (NO YOUTUBE IFRAME) -->
        <div id="sticky-player" class="sticky-player">
            <div class="player-row">
                <div class="track-info">
                    <img id="player-art" class="track-art" src="" alt="Album Art">
                    <div class="track-meta">
                        <div id="player-title" class="track-title">Canción</div>
                        <div id="player-artist" class="track-artist">Artista</div>
                        <span id="player-tag" class="track-duration-tag">Canción Completa</span>
                    </div>
                </div>
                <audio id="audio-player" controls autoplay></audio>
                <a id="btn-download-direct" href="#" download target="_blank" class="btn-download-direct">
                    <span>⬇️ Descargar MP3</span>
                </a>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div id="results-grid" class="results-grid"></div>

        <footer>
            PacheKing Autonomous Station &bull; Servidor Descentralizado &bull; Streaming Global Corporativo
        </footer>
    </div>

    <script>
        function formatDuration(sec) {
            if (!sec) return 'Completa';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s} min`;
        }

        function playStream(audioUrl, title, artist, artUrl, durStr) {
            const player = document.getElementById('sticky-player');
            const audio = document.getElementById('audio-player');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const artElem = document.getElementById('player-art');
            const tagElem = document.getElementById('player-tag');
            const dlBtn = document.getElementById('btn-download-direct');

            titleElem.innerText = title;
            artistElem.innerText = artist;
            artElem.src = artUrl;
            tagElem.innerText = `Canción Completa • ${durStr}`;

            audio.src = audioUrl;
            audio.play();

            dlBtn.href = audioUrl;

            player.style.display = 'block';
            player.scrollIntoView({ behavior: 'smooth' });
        }

        async function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Buscando canciones completas en streaming libre... 🎶</div>';

            try {
                // Decentralized global audio network with 100% full songs & open CORS
                const res = await fetch(`https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=PacheKing`);
                const json = await res.json();
                const tracks = json.data || [];

                if (tracks.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones. Intenta con otra palabra.</div>';
                    return;
                }

                grid.innerHTML = '';
                tracks.slice(0, 18).forEach(t => {
                    const id = t.id;
                    const title = t.title || 'Sin título';
                    const artist = (t.user && t.user.name) ? t.user.name : 'Artista';
                    const dur = formatDuration(t.duration);
                    
                    let art = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop';
                    if (t.artwork && t.artwork['480x480']) {
                        art = t.artwork['480x480'];
                    } else if (t.artwork && t.artwork['150x150']) {
                        art = t.artwork['150x150'];
                    }

                    // Direct Full MP3 Stream endpoint
                    const streamUrl = `https://api.audius.co/v1/tracks/${id}/stream?app_name=PacheKing`;

                    const card = document.createElement('div');
                    card.className = 'track-card';
                    card.innerHTML = `
                        <div class="card-top" onclick="playStream('${streamUrl}', '${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${art}', '${dur}')">
                            <div class="card-art-box">
                                <img src="${art}" alt="${title}" loading="lazy">
                                <div class="card-play-overlay">▶</div>
                            </div>
                            <div class="card-meta">
                                <div class="card-song-name" title="${title}">${title}</div>
                                <div class="card-artist-name">${artist}</div>
                                <div class="card-duration">Duración: ${dur}</div>
                            </div>
                        </div>
                        <div class="card-actions-row">
                            <a href="javascript:void(0)" onclick="playStream('${streamUrl}', '${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${art}', '${dur}')" class="btn-card-action btn-play-card">▶ Escuchar Completa</a>
                            <a href="${streamUrl}" target="_blank" download class="btn-card-action btn-dl-card">⬇️ MP3</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error al conectar con la red de streaming. Inténtalo de nuevo.</div>';
            }
        }

        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
    </script>
</body>
</html>
