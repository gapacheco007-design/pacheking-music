            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {

            max-width: 1050px;
        }

        header {

        }

        .badge-provider {

            padding: 0.35rem 0.95rem;

            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;

            margin-bottom: 0.5rem;

        p.subtitle {
            color: var(--text-sub);

        }

            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            padding: 0.9rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
        }

        button.btn-search {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.9rem 1.85rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .player-box {
            display: none;
            background: rgba(18, 24, 38, 0.98);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-info-side {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 220px;
        }

        .player-art-img {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #000;
        }

        .player-text-block {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .player-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-artist {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.15rem;
        }

            display: flex;
            align-items: center;
            gap: 1.25rem;
            min-width: 320px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .player-controls-side audio {
            flex: 1;
            min-width: 260px;
            height: 42px;
            border-radius: 20px;
            outline: none;
        }

            background: linear-gradient(135deg, #10b981, #059669);

            text-decoration: none;
            padding: 0.65rem 1.4rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-download-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .card-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

            height: 76px;

            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .card-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            display: flex;
            flex-direction: column;
            justify-content: center;

        function findLocalSong(title, artist) {
            const normalize = s => (s || '').toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9 ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            const cleanTitle = normalize(title);
            const cleanArtist = normalize(artist);
            
            for (const item of GITHUB_CATALOG) {
                const itemArtistNorm = normalize(item.artist);
                const artistMatch = !cleanArtist || cleanArtist.includes(itemArtistNorm) || itemArtistNorm.includes(cleanArtist);
                for (const kw of item.keywords) {
                    const normKw = normalize(kw);
                    if (cleanTitle.includes(normKw)) {
                        if (artistMatch || normKw.length >= 6) {
                            return item;
                        }
                    }
                }
            }
            return null;
        }

        function formatDuration(ms) {
            if (!ms) return 'Completa';
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = Math.floor(totalSec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s} min`;
        }

        function playFullSong(title, artist, audioUrl, artworkUrl, durationStr) {
            const player = document.getElementById('player-box');
            const audio = document.getElementById('audio-player');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const artElem = document.getElementById('player-art');
            const statusElem = document.getElementById('player-status');
            const dlBtn = document.getElementById('btn-download-mp3');

            player.style.display = 'flex';
            player.scrollIntoView({ behavior: 'smooth' });

            titleElem.innerText = title;
            artistElem.innerText = artist;
            artElem.src = artworkUrl || '';

            const local = findLocalSong(title, artist);
            const finalUrl = local ? local.file : audioUrl;
            const isFull = !!local || (finalUrl && (finalUrl.startsWith('music/') || finalUrl.includes('archive.org')));

            audio.src = finalUrl;
            audio.play().catch(e => console.log('Autoplay:', e));

            dlBtn.href = finalUrl;
            dlBtn.setAttribute('download', `${title} - ${artist}.mp3`);

            if (isFull) {
                statusElem.innerHTML = `● <span>Canción COMPLETA original (${durationStr || 'Sin cortes'}) • SpotiFLAC HQ</span>`;
                statusElem.style.color = '#10b981';
            } else {
                statusElem.innerHTML = `● <span>Reproduciendo vista previa (${durationStr || '30s'}) • SpotiFLAC</span>`;
                statusElem.style.color = '#f59e0b';
            }
        }

        // MOTOR DE RESOLUCIÓN DINÁMICA DE CANCIONES COMPLETAS
        const dynamicTrackCache = new Map();

        function normalizeStr(s) {
            return (s || '').toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9 ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function parseDurationSeconds(lengthVal) {
            if (!lengthVal) return 0;
            const str = String(lengthVal).trim();
            if (str.includes(':')) {
                const parts = str.split(':').map(Number);
                if (parts.length === 2) return (parts[0] * 60) + parts[1];
                if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            }
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        async function resolveFullTrackOnline(title, artist) {
            const cacheKey = `${artist} - ${title}`.toLowerCase();
            if (dynamicTrackCache.has(cacheKey)) {
                return dynamicTrackCache.get(cacheKey);
            }

            try {
                const cleanTitle = (title || '').replace(/[\(\[\{].*?[\)\]\}]/g, '').trim();
                const cleanArtist = (artist || '').replace(/\b(feat|ft|con|featuring)\b.*$/i, '').split(/[,&]/)[0].trim();
                const normTitle = normalizeStr(cleanTitle);
                const normArtist = normalizeStr(cleanArtist);

                if (!normTitle) return null;

                const titleWords = normTitle.split(' ').filter(w => w.length >= 3);
                const queries = [
                    `mediatype:audio AND "${normTitle}" AND (${normArtist})`,
                    `mediatype:audio AND ${normArtist} ${normTitle}`,
                    `${normArtist} ${normTitle} format:MP3`
                ];

                for (const q of queries) {
                    const searchUrl = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier,title,creator,mediatype&sort[]=downloads+desc&rows=4&output=json`;
                    const resp = await fetch(searchUrl);
                    if (!resp.ok) continue;
                    const data = await resp.json();
                    const docs = data?.response?.docs || [];

                    for (const doc of docs) {
                        const metaUrl = `https://archive.org/metadata/${doc.identifier}/files`;
                        const mResp = await fetch(metaUrl);
                        if (!mResp.ok) continue;
                        const mData = await mResp.json();
                        const files = mData?.result || [];

                        const candidates = files.filter(f => {
                            const name = (f.name || '').toLowerCase();
                            if (!name.endsWith('.mp3')) return false;
                            const dur = parseDurationSeconds(f.length);
                            return dur >= 75 && dur <= 720;
                        });

                        if (candidates.length === 0) continue;

                        // Filtrar grabaciones no deseadas (karaoke, tributos, instrumentales) a menos que se hayan pedido
                        const badTerms = ['karaoke', 'instrumental', 'tributo', 'tribute', 'backing track'];
                        const filtered = candidates.filter(f => {
                            const fn = (f.name || '').toLowerCase();
                            return !badTerms.some(b => fn.includes(b) && !normTitle.includes(b));
                        });
                        const pool = filtered.length > 0 ? filtered : candidates;

                        // Buscar coincidencia en título o nombre de archivo
                        let matched = pool.find(f => {
                            const fnNorm = normalizeStr(f.name);
                            const ftNorm = normalizeStr(f.title);
                            if (titleWords.length === 0) return true;
                            const matchedCount = titleWords.filter(w => fnNorm.includes(w) || ftNorm.includes(w)).length;
                            const threshold = Math.min(2, titleWords.length);
                            return matchedCount >= threshold;
                        });

                        // Fallback: si la consulta usó comillas exactas y el pool tiene 1 o pocos tracks
                        if (!matched && q.includes(`"${normTitle}"`) && pool.length <= 3) {
                            matched = pool[0];
                        }

                        if (matched) {
                            const fullUrl = `https://archive.org/download/${doc.identifier}/${encodeURIComponent(matched.name)}`;
                            const durSec = Math.round(parseDurationSeconds(matched.length));
                            const mins = Math.floor(durSec / 60);
                            const secs = String(durSec % 60).padStart(2, '0');
                            const durFormatted = `${mins}:${secs} min`;

                            const result = {
                                url: fullUrl,
                                duration: durFormatted,
                                title: matched.name
                            };
                            dynamicTrackCache.set(cacheKey, result);
                            return result;
                        }
                    }
                }
            } catch (err) {
                console.warn('Error en resolución dinámica:', err);
            }
            return null;
        }

        async function playSongWithAutoResolve(title, artist, previewFallback, art, durFallback) {
            const local = findLocalSong(title, artist);
            if (local) {
                playFullSong(title, artist, local.file, art || local.art, local.dur);
                return;
            }

            const player = document.getElementById('player-box');
            const audio = document.getElementById('audio-player');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const artElem = document.getElementById('player-art');
            const statusElem = document.getElementById('player-status');
            const dlBtn = document.getElementById('btn-download-mp3');

            player.style.display = 'flex';
            player.scrollIntoView({ behavior: 'smooth' });

            titleElem.innerText = title;
            artistElem.innerText = artist;
            artElem.src = art || 'https://via.placeholder.com/300x300.png?text=SpotiFLAC';
            statusElem.innerHTML = `⚡ <span>Localizando audio original completo...</span>`;
            statusElem.style.color = '#38bdf8';

            const resolved = await resolveFullTrackOnline(title, artist);
            if (resolved && resolved.url) {
                audio.src = resolved.url;
                audio.play().catch(e => console.log('Autoplay:', e));
                dlBtn.href = resolved.url;
                dlBtn.setAttribute('download', `${title} - ${artist}.mp3`);
                statusElem.innerHTML = `● <span>Canción COMPLETA original (${resolved.duration}) • SpotiFLAC HQ</span>`;
                statusElem.style.color = '#10b981';
            } else {
                audio.src = previewFallback;
                audio.play().catch(e => console.log('Autoplay:', e));
                dlBtn.href = previewFallback;
                dlBtn.setAttribute('download', `${title} - ${artist}.mp3`);
                statusElem.innerHTML = `● <span>Reproduciendo vista previa (${durFallback || '30s'}) • SpotiFLAC</span>`;
                statusElem.style.color = '#f59e0b';
            }
        }

        async function downloadWithAutoResolve(e, title, artist, fallbackUrl) {
            e.stopPropagation();
            const local = findLocalSong(title, artist);
            if (local) {
                window.open(local.file, '_blank');
                return;
            }
            const statusElem = document.getElementById('player-status');
            if (statusElem) {
                statusElem.innerHTML = `⚡ <span>Preparando descarga completa en audio original...</span>`;
                statusElem.style.color = '#38bdf8';
            }
            const resolved = await resolveFullTrackOnline(title, artist);
            const dlUrl = (resolved && resolved.url) ? resolved.url : fallbackUrl;
            window.open(dlUrl, '_blank');
        }

        function showLocalCatalog(e) {
            if (e && e.preventDefault) e.preventDefault();
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            GITHUB_CATALOG.forEach(t => {
                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playFullSong(t.title, t.artist, t.file, t.art, t.dur);
                card.innerHTML = `
                    <div class="card-top">

                            <img src="${t.art}" alt="${t.title}" loading="lazy">

                        <div class="card-meta">
                            <div class="card-song-name" title="${t.title}">${t.title}</div>
                            <div class="card-artist-name">${t.artist}</div>
                            <div class="card-duration" style="color: #10b981; font-weight: 700;">Duración: ${t.dur} (Completa)</div>
                        </div>
                    </div>
                    <div class="card-actions-row">
                        <a href="javascript:void(0)" class="btn-card-action btn-play-card" style="background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;">▶ Escuchar Completa</a>
                        <a href="${t.file}" download="${t.title} - ${t.artist}.mp3" class="btn-card-action btn-dl-card" onclick="event.stopPropagation()">⬇️ MP3 Completo</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function quickSearch(artistName) {
            document.getElementById('query-input').value = artistName;
            handleSearch({ preventDefault: () => {} });
        }

        window.itunesCatalogCallback = function(data) {
            const grid = document.getElementById('results-grid');
            const tracks = (data && data.results) ? data.results : [];

            if (tracks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones. Intenta con otra búsqueda.</div>';
                return;
            }

            grid.innerHTML = '';
            tracks.forEach(t => {
                const title = t.trackName || 'Sin título';
                const artist = t.artistName || 'Artista';
                const dur = formatDuration(t.trackTimeMillis);
                const art = (t.artworkUrl100 || '').replace('100x100bb', '300x300bb');
                const preview = t.previewUrl || '';
                const local = findLocalSong(title, artist);
                const isFull = !!local;
                const playUrl = isFull ? local.file : preview;
                const playLabel = isFull ? '▶ Canción Completa' : '▶ Escuchar Completa ⚡';
                const durLabel = isFull ? `Duración: ${local.dur} (Completa)` : `Duración: ${dur} (Auto HQ)`;
                const durColor = isFull ? 'color: #10b981; font-weight: 700;' : 'color: #38bdf8; font-weight: 600;';

                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playSongWithAutoResolve(title, artist, preview, art, dur);
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-art-box">
                            <img src="${art}" alt="${title}" loading="lazy">
                            <div class="card-play-overlay">▶</div>
                        </div>
                        <div class="card-meta">
                            <div class="card-song-name" title="${title}">${title}</div>
                            <div class="card-artist-name">${artist}</div>
                            <div class="card-duration" style="${durColor}">${durLabel}</div>
                        </div>
                    </div>
                    <div class="card-actions-row">
                        <a href="javascript:void(0)" class="btn-card-action btn-play-card" style="${isFull ? 'background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;' : 'background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);'}">${playLabel}</a>
                        <a href="javascript:void(0)" class="btn-card-action btn-dl-card" onclick="downloadWithAutoResolve(event, '${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${playUrl}')">⬇️ ${isFull ? 'MP3 Completo' : 'Descargar MP3'}</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Cargando catálogo SpotiFLAC... ⚡</div>';

            const oldScript = document.getElementById('itunes-jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'itunes-jsonp-script';
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=24&callback=itunesCatalogCallback`;
            script.onerror = function() {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error al conectar con el catálogo. Intenta de nuevo.</div>';
            };
            document.body.appendChild(script);
        }

        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
