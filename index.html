<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiFLAC Web - PacheKing Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge-provider {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.95rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* SEARCH BOX */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            padding: 0.9rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
        }

        button.btn-search {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.9rem 1.85rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* REPRODUCTOR OFICIAL SOUNDCLOUD WIDGET */
        .sc-player-box {
            display: none;
            background: rgba(18, 24, 38, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sc-iframe-wrapper {
            width: 100%;
            height: 166px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 1.25rem;
        }

        .sc-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .sc-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .now-playing-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
        }

        .btn-download-direct {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 0.65rem 1.4rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-download-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .card-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-art-box {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .card-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .track-card:hover .card-play-overlay {
            opacity: 1;
        }

        .card-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-song-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .card-artist-name {
            color: var(--text-sub);
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-duration {
            color: #34d399;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 0.35rem;
        }

        .card-actions-row {
            display: flex;
            gap: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.85rem;
        }

        .btn-card-action {
            flex: 1;
            text-align: center;
            padding: 0.55rem 0.2rem;
            border-radius: 7px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-play-card {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .btn-play-card:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .btn-dl-card {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            color: #c084fc;
        }

        .btn-dl-card:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        footer {
            margin-top: 3.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge-provider">
                <span>⚡ SpotiFLAC Engine &bull; Canciones COMPLETAS Sin YouTube</span>
            </div>
            <h1>SpotiFLAC Web</h1>
            <p class="subtitle">Catálogo oficial con canciones COMPLETAS (3 a 5 min) y reproductor en vivo</p>
        </header>

        <!-- SEARCH BOX -->
        <div class="search-card">
            <form id="search-form" class="search-group" onsubmit="handleSearch(event)">
                <input type="text" id="query-input" placeholder="Escribe canción o artista (ej: Calle 13, Bad Bunny, Coldplay)..." required autocomplete="off">
                <button type="submit" class="btn-search">
                    <span>Buscar</span>
                    <span>🔍</span>
                </button>
            </form>
        </div>

        <!-- REPRODUCTOR SOUNDCLOUD (FULL TRACKS - COMPLETA) -->
        <div id="sc-player-box" class="sc-player-box">
            <div class="sc-iframe-wrapper">
                <iframe id="sc-player-frame" src="" allow="autoplay" scrolling="no"></iframe>
            </div>
            <div class="sc-bottom-row">
                <div class="now-playing-title" id="now-playing-title">Reproduciendo canción completa...</div>
                <a id="btn-download-direct" href="#" target="_blank" class="btn-download-direct">
                    <span>⬇️ Descargar Pista Completa</span>
                </a>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div id="results-grid" class="results-grid"></div>

        <footer>
            SpotiFLAC Mobile Web Adapter &bull; registry.json Provider: soundcloud.sflx &bull; PacheKing Station
        </footer>
    </div>

    <script>
        function formatDuration(ms) {
            if (!ms) return 'Completa';
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = Math.floor(totalSec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s} min`;
        }

        function playFullSong(title, artist) {
            const player = document.getElementById('sc-player-box');
            const iframe = document.getElementById('sc-player-frame');
            const titleElem = document.getElementById('now-playing-title');
            const dlBtn = document.getElementById('btn-download-direct');

            titleElem.innerText = `${title} • ${artist}`;

            // Search & stream FULL song using official SoundCloud HTML5 player (Bypasses YouTube and plays 100% full track)
            const cleanQuery = encodeURIComponent(`${title} ${artist}`);
            const scUrl = `https://soundcloud.com/search/sounds?q=${cleanQuery}`;
            
            iframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(scUrl)}&color=%2310b981&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false`;

            dlBtn.href = `https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${cleanQuery}&f=mp3`;

            player.style.display = 'block';
            player.scrollIntoView({ behavior: 'smooth' });
        }

        window.itunesCatalogCallback = function(data) {
            const grid = document.getElementById('results-grid');
            const tracks = (data && data.results) ? data.results : [];

            if (tracks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones. Intenta con otra búsqueda.</div>';
                return;
            }

            grid.innerHTML = '';
            tracks.forEach(t => {
                const title = t.trackName || 'Sin título';
                const artist = t.artistName || 'Artista';
                const dur = formatDuration(t.trackTimeMillis);
                const art = (t.artworkUrl100 || '').replace('100x100bb', '300x300bb');
                const cleanQuery = encodeURIComponent(`${title} ${artist}`);

                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playFullSong(title.replace(/'/g, "\\'"), artist.replace(/'/g, "\\'"));
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-art-box">
                            <img src="${art}" alt="${title}" loading="lazy">
                            <div class="card-play-overlay">▶</div>
                        </div>
                        <div class="card-meta">
                            <div class="card-song-name" title="${title}">${title}</div>
                            <div class="card-artist-name">${artist}</div>
                            <div class="card-duration">Duración: ${dur}</div>
                        </div>
                    </div>
                    <div class="card-actions-row">
                        <a href="javascript:void(0)" class="btn-card-action btn-play-card">▶ Canción Completa</a>
                        <a href="https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${cleanQuery}&f=mp3" target="_blank" class="btn-card-action btn-dl-card">⬇️ MP3</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Cargando catálogo SpotiFLAC... ⚡</div>';

            const oldScript = document.getElementById('itunes-jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'itunes-jsonp-script';
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=24&callback=itunesCatalogCallback`;
            script.onerror = function() {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error al conectar con el catálogo. Intenta de nuevo.</div>';
            };
            document.body.appendChild(script);
        }

        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
    </script>
</body>
</html>
