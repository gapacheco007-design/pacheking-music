<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiFLAC Web - PacheKing Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge-provider {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.95rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* SEARCH BOX */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.75rem;
            padding: 0.9rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
        }

        button.btn-search {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.9rem 1.85rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* REPRODUCTOR NATIVO HTML5 AUDIO - SPOTIFLAC HQ (FULL CANCIÓN) */
        .player-box {
            display: none;
            background: rgba(18, 24, 38, 0.98);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(20px);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-info-side {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 220px;
        }

        .player-art-img {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #000;
        }

        .player-text-block {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .player-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-artist {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .player-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.15rem;
        }

        .player-controls-side {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            min-width: 320px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .player-controls-side audio {
            flex: 1;
            min-width: 260px;
            height: 42px;
            border-radius: 20px;
            outline: none;
        }

        .btn-download-direct {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 0.65rem 1.4rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-download-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .card-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-art-box {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .card-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .track-card:hover .card-play-overlay {
            opacity: 1;
        }

        .card-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-song-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .card-artist-name {
            color: var(--text-sub);
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-duration {
            color: #34d399;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 0.35rem;
        }

        .card-actions-row {
            display: flex;
            gap: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.85rem;
        }

        .btn-card-action {
            flex: 1;
            text-align: center;
            padding: 0.55rem 0.2rem;
            border-radius: 7px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-play-card {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
        }

        .btn-play-card:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .btn-dl-card {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            color: #c084fc;
        }

        .btn-dl-card:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        footer {
            margin-top: 3.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge-provider">
                <span>⚡ SpotiFLAC Engine &bull; Canciones COMPLETAS Sin YouTube</span>
            </div>
            <h1>SpotiFLAC Web</h1>
            <p class="subtitle">Catálogo oficial con canciones COMPLETAS (3 a 5 min) y reproductor en vivo</p>
        </header>

        <!-- SEARCH BOX -->
        <div class="search-card">
            <form id="search-form" class="search-group" onsubmit="handleSearch(event)">
                <input type="text" id="query-input" placeholder="Escribe canción o artista (ej: Calle 13, Ricardo Arjona, Bad Bunny)..." required autocomplete="off">
                <button type="submit" class="btn-search">
                    <span>Buscar</span>
                    <span>🔍</span>
                </button>
            </form>
        </div>

        <!-- QUICK FILTER PILLS -->
        <div class="filter-pills-row" style="display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <button type="button" class="btn-pill" onclick="showLocalCatalog(event)" style="background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; padding: 0.45rem 1rem; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 0.85rem;">
                🔥 Pistas COMPLETAS en GitHub (10)
            </button>
            <button type="button" class="btn-pill" onclick="quickSearch('Calle 13')" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); padding: 0.45rem 1rem; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem;">
                Calle 13
            </button>
            <button type="button" class="btn-pill" onclick="quickSearch('Ricardo Arjona')" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); padding: 0.45rem 1rem; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem;">
                Ricardo Arjona
            </button>
            <button type="button" class="btn-pill" onclick="quickSearch('Bad Bunny')" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); padding: 0.45rem 1rem; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem;">
                Bad Bunny
            </button>
        </div>

        <!-- REPRODUCTOR NATIVO SPOTIFLAC (FULL TRACKS - CANCIÓN COMPLETA) -->
        <div id="player-box" class="player-box">
            <div class="player-info-side">
                <img id="player-art" class="player-art-img" src="" alt="Album Cover">
                <div class="player-text-block">
                    <div id="player-title" class="player-title">Selecciona una canción</div>
                    <div id="player-artist" class="player-artist">SpotiFLAC HQ</div>
                    <div id="player-status" class="player-status-badge">● Listo</div>
                </div>
            </div>
            <div class="player-controls-side">
                <audio id="audio-player" controls autoplay></audio>
                <a id="btn-download-mp3" href="#" target="_blank" class="btn-download-direct">
                    <span>⬇️ Descargar MP3</span>
                </a>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div id="results-grid" class="results-grid"></div>

        <footer>
            SpotiFLAC Mobile Web &bull; Servido directamente desde GitHub &bull; PacheKing Station
        </footer>
    </div>

    <script>
        const GITHUB_CATALOG = [
            {
                keywords: ['muerte en hawaii', 'muerte hawai', 'muerte'],

                artist: 'Calle 13',

            },

            },
            {
                keywords: ['latinoamerica', 'latino america'],
                file: 'music/calle-13-latinoamerica.mp3?v=album_master_2026',
                title: 'Latinoamérica',
                artist: 'Calle 13',
                dur: '5:01 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/bf/25/7f/bf257f00-3490-67c7-c7ba-4baec8d1c073/886443180424.jpg/300x300bb.jpg'
            },
            {
                keywords: ['fiesta de locos', 'locos'],
                file: 'music/calle-13-fiesta-de-locos.mp3?v=album_master_2026',
                title: 'Fiesta de Locos',
                artist: 'Calle 13',
                dur: '4:27 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/bf/25/7f/bf257f00-3490-67c7-c7ba-4baec8d1c073/886443180424.jpg/300x300bb.jpg'
            },
            {
                keywords: ['desnuda'],
                file: 'music/ricardo-arjona-desnuda.mp3?v=album_master_2026',
                title: 'Desnuda',
                artist: 'Ricardo Arjona',
                dur: '4:14 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/37/e5/22/37e5225c-091f-0e98-2e06-d98f79d9e4a8/00743216259021.rgb.jpg/300x300bb.jpg'
            },
            {
                keywords: ['el problema', 'problema'],
                file: 'music/ricardo-arjona-el-problema.mp3?v=album_master_2026',
                title: 'El Problema',
                artist: 'Ricardo Arjona',
                dur: '5:30 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/4a/12/32/4a12328d-1fa0-82a6-cb4b-1481b03eecb2/886443360215.jpg/300x300bb.jpg'
            },
            {
                keywords: ['historia de taxi', 'taxi'],
                file: 'music/ricardo-arjona-historia-de-taxi.mp3?v=album_master_2026',
                title: 'Historia de Taxi',
                artist: 'Ricardo Arjona',
                dur: '6:42 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/37/e5/22/37e5225c-091f-0e98-2e06-d98f79d9e4a8/00743216259021.rgb.jpg/300x300bb.jpg'
            },
            {
                keywords: ['fuiste tu'],
                file: 'music/ricardo-arjona-fuiste-tu.mp3?v=album_master_2026',
                title: 'Fuiste Tú (feat. Gaby Moreno)',
                artist: 'Ricardo Arjona',
                dur: '4:25 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/4a/12/32/4a12328d-1fa0-82a6-cb4b-1481b03eecb2/886443360215.jpg/300x300bb.jpg'
            },
            {
                keywords: ['cuatro decadas', 'senora de las cuatro decadas', 'cuatro'],
                file: 'music/ricardo-arjona-senora-de-las-cuatro-decadas.mp3?v=album_master_2026',
                title: 'Señora de las Cuatro Décadas',
                artist: 'Ricardo Arjona',
                dur: '5:06 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/37/e5/22/37e5225c-091f-0e98-2e06-d98f79d9e4a8/00743216259021.rgb.jpg/300x300bb.jpg'
            },
            {
                keywords: ['ojitos lindos', 'ojitos'],
                file: 'music/bad-bunny-ojitos-lindos.mp3?v=album_master_2026',
                title: 'Ojitos Lindos',
                artist: 'Bad Bunny & Bomba Estéreo',
                dur: '4:18 min',
                art: 'https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/38/53/b7/3853b7db-d86f-2179-c5c2-f1df4649f485/196626945068.jpg/300x300bb.jpg'
            }
        ];

        function findLocalSong(title, artist) {
            const normalize = s => (s || '').toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9 ]/g, '')
                .trim();
            const cleanTitle = normalize(title);
            
            for (const item of GITHUB_CATALOG) {
                for (const kw of item.keywords) {
                    if (cleanTitle.includes(kw)) {
                        return item;
                    }
                }
            }
            return null;
        }

        function formatDuration(ms) {
            if (!ms) return 'Completa';
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = Math.floor(totalSec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s} min`;
        }

        function playFullSong(title, artist, audioUrl, artworkUrl, durationStr) {
            const player = document.getElementById('player-box');
            const audio = document.getElementById('audio-player');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const artElem = document.getElementById('player-art');
            const statusElem = document.getElementById('player-status');
            const dlBtn = document.getElementById('btn-download-mp3');

            player.style.display = 'flex';
            player.scrollIntoView({ behavior: 'smooth' });

            titleElem.innerText = title;
            artistElem.innerText = artist;
            artElem.src = artworkUrl || '';

            const local = findLocalSong(title, artist);
            const finalUrl = local ? local.file : audioUrl;
            const isFull = !!local || (finalUrl && finalUrl.startsWith('music/'));

            audio.src = finalUrl;
            audio.play().catch(e => console.log('Autoplay:', e));

            dlBtn.href = finalUrl;
            dlBtn.setAttribute('download', `${title} - ${artist}.mp3`);

            if (isFull) {
                statusElem.innerHTML = `● <span>Canción COMPLETA desde GitHub (${durationStr || 'Sin cortes'}) • SpotiFLAC HQ</span>`;
                statusElem.style.color = '#10b981';
            } else {
                statusElem.innerHTML = `● <span>Reproduciendo vista previa (${durationStr || '30s'}) • SpotiFLAC</span>`;
                statusElem.style.color = '#f59e0b';
            }
        }

        function showLocalCatalog(e) {
            if (e && e.preventDefault) e.preventDefault();
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            GITHUB_CATALOG.forEach(t => {
                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playFullSong(t.title, t.artist, t.file, t.art, t.dur);
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-art-box">
                            <img src="${t.art}" alt="${t.title}" loading="lazy">
                            <div class="card-play-overlay">▶</div>
                        </div>
                        <div class="card-meta">
                            <div class="card-song-name" title="${t.title}">${t.title}</div>
                            <div class="card-artist-name">${t.artist}</div>
                            <div class="card-duration" style="color: #10b981; font-weight: 700;">Duración: ${t.dur} (Completa)</div>
                        </div>
                    </div>
                    <div class="card-actions-row">
                        <a href="javascript:void(0)" class="btn-card-action btn-play-card" style="background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;">▶ Escuchar Completa</a>
                        <a href="${t.file}" download="${t.title} - ${t.artist}.mp3" class="btn-card-action btn-dl-card" onclick="event.stopPropagation()">⬇️ MP3 Completo</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function quickSearch(artistName) {
            document.getElementById('query-input').value = artistName;
            handleSearch({ preventDefault: () => {} });
        }

        window.itunesCatalogCallback = function(data) {
            const grid = document.getElementById('results-grid');
            const tracks = (data && data.results) ? data.results : [];

            if (tracks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones. Intenta con otra búsqueda.</div>';
                return;
            }

            grid.innerHTML = '';
            tracks.forEach(t => {
                const title = t.trackName || 'Sin título';
                const artist = t.artistName || 'Artista';
                const dur = formatDuration(t.trackTimeMillis);
                const art = (t.artworkUrl100 || '').replace('100x100bb', '300x300bb');
                const preview = t.previewUrl || '';
                const local = findLocalSong(title, artist);
                const isFull = !!local;
                const playUrl = isFull ? local.file : preview;
                const playLabel = isFull ? '▶ Canción Completa' : '▶ Escuchar Directo';
                const durLabel = isFull ? `Duración: ${local.dur} (Completa)` : `Duración: ${dur}`;
                const durColor = isFull ? 'color: #10b981; font-weight: 700;' : '';

                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playFullSong(title, artist, playUrl, art, isFull ? local.dur : dur);
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-art-box">
                            <img src="${art}" alt="${title}" loading="lazy">
                            <div class="card-play-overlay">▶</div>
                        </div>
                        <div class="card-meta">
                            <div class="card-song-name" title="${title}">${title}</div>
                            <div class="card-artist-name">${artist}</div>
                            <div class="card-duration" style="${durColor}">${durLabel}</div>
                        </div>
                    </div>
                    <div class="card-actions-row">
                        <a href="javascript:void(0)" class="btn-card-action btn-play-card" style="${isFull ? 'background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981;' : ''}">${playLabel}</a>
                        <a href="${playUrl}" download="${title} - ${artist}.mp3" class="btn-card-action btn-dl-card" onclick="event.stopPropagation()">⬇️ ${isFull ? 'MP3 Completo' : 'Descargar'}</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Cargando catálogo SpotiFLAC... ⚡</div>';

            const oldScript = document.getElementById('itunes-jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'itunes-jsonp-script';
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=24&callback=itunesCatalogCallback`;
            script.onerror = function() {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error al conectar con el catálogo. Intenta de nuevo.</div>';
            };
            document.body.appendChild(script);
        }

        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
    </script>
</body>
</html>
