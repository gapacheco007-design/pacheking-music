<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacheKing Music - YouTube & Music Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* SEARCH BOX */
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            margin-bottom: 2rem;
        }

        .search-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.85rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-red);
        }

        button.btn-search {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem 1.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.btn-search:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* DEDICATED STREAMING AUDIO PLAYER */
        .sticky-player {
            display: none;
            background: rgba(22, 29, 47, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.25rem;
        }

        .track-details {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 260px;
        }

        .track-cover {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .track-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
            color: white;
        }

        .track-artist {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        audio {
            flex: 1.5;
            min-width: 280px;
            height: 42px;
            outline: none;
        }

        .download-actions {
            display: flex;
            gap: 0.6rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.65rem 1.1rem;
            border-radius: 0.6rem;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-yt {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-yt:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-2px);
        }

        .btn-mp3 {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .btn-mp3:hover {
            background: rgba(16, 185, 129, 0.25);
            transform: translateY(-2px);
        }

        /* GRID RESULTS */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.25rem;
        }

        .song-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s;
            cursor: pointer;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(27, 36, 56, 0.95);
        }

        .song-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .song-img-wrap {
            position: relative;
            width: 74px;
            height: 74px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .song-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-play-btn {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .song-card:hover .song-play-btn {
            opacity: 1;
        }

        .song-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .song-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-sub);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-album {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions-row {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.75rem;
        }

        .song-actions-row a {
            flex: 1;
            text-align: center;
            padding: 0.45rem 0.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
        }

        footer {
            margin-top: 3.5rem;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">
                <span>🎵 PacheKing Streaming & Downloader</span>
            </div>
            <h1>PacheKing Music</h1>
            <p class="subtitle">Busca canciones, reproduce audio en streaming al instante y descarga en MP3 o YouTube</p>
        </header>

        <!-- SEARCH BOX -->
        <div class="search-card">
            <form id="search-form" class="search-group" onsubmit="handleSearch(event)">
                <input type="text" id="query-input" placeholder="Escribe el nombre de una canción, artista (ej: Calle 13, Bad Bunny, Coldplay)..." required autocomplete="off">
                <button type="submit" class="btn-search">
                    <span>Buscar</span>
                    <span>🔍</span>
                </button>
            </form>
        </div>

        <!-- STICKY PLAYER -->
        <div id="sticky-player" class="sticky-player">
            <div class="player-content">
                <div class="track-details">
                    <img id="player-cover" class="track-cover" src="" alt="Cover">
                    <div>
                        <div id="player-title" class="track-title">Canción</div>
                        <div id="player-artist" class="track-artist">Artista</div>
                    </div>
                </div>
                <audio id="audio-player" controls autoplay></audio>
                <div class="download-actions">
                    <a id="btn-yt-search" href="#" target="_blank" class="btn-action btn-yt">
                        <span>▶ Ver en YouTube</span>
                    </a>
                    <a id="btn-dl-audio" href="#" target="_blank" class="btn-action btn-mp3">
                        <span>⬇️ Descargar MP3</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div id="results-grid" class="results-grid"></div>

        <footer>
            PacheKing Autonomous Station &bull; GitHub Pages CDN &bull; Streaming Global
        </footer>
    </div>

    <script>
        function playTrack(audioUrl, title, artist, coverUrl) {
            const player = document.getElementById('sticky-player');
            const audioElement = document.getElementById('audio-player');
            const titleElem = document.getElementById('player-title');
            const artistElem = document.getElementById('player-artist');
            const coverElem = document.getElementById('player-cover');
            const ytBtn = document.getElementById('btn-yt-search');
            const dlBtn = document.getElementById('btn-dl-audio');

            titleElem.innerText = title;
            artistElem.innerText = artist;
            coverElem.src = coverUrl;

            // Direct streaming
            audioElement.src = audioUrl;
            audioElement.play();

            // Direct Search & Download Links
            const cleanQuery = encodeURIComponent(`${title} ${artist}`);
            ytBtn.href = `https://www.youtube.com/results?search_query=${cleanQuery}`;
            dlBtn.href = `https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${cleanQuery}&f=mp3`;

            player.style.display = 'block';
            player.scrollIntoView({ behavior: 'smooth' });
        }

        async function handleSearch(e) {
            if (e && e.preventDefault) e.preventDefault();
            const query = document.getElementById('query-input').value.trim();
            if (!query) return;

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">Buscando en catálogo global... 🎶</div>';

            try {
                // High-availability iTunes global API (CORS enabled, 100% reliable, no key needed)
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=24`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 2.5rem;">No se encontraron canciones con ese nombre. Intenta con otra palabra.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.results.forEach(track => {
                    const title = track.trackName || 'Sin título';
                    const artist = track.artistName || 'Artista';
                    const album = track.collectionName || '';
                    const cover = (track.artworkUrl100 || '').replace('100x100bb', '300x300bb');
                    const preview = track.previewUrl;
                    const cleanQuery = encodeURIComponent(`${title} ${artist}`);

                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.innerHTML = `
                        <div class="song-top" onclick="playTrack('${preview}', '${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${cover}')">
                            <div class="song-img-wrap">
                                <img src="${cover}" alt="${title}" loading="lazy">
                                <div class="song-play-btn">▶</div>
                            </div>
                            <div class="song-meta">
                                <div class="song-name" title="${title}">${title}</div>
                                <div class="song-artist">${artist}</div>
                                <div class="song-album" title="${album}">${album}</div>
                            </div>
                        </div>
                        <div class="song-actions-row">
                            <a href="https://www.youtube.com/results?search_query=${cleanQuery}" target="_blank" class="btn-yt">YouTube ▶</a>
                            <a href="https://loader.to/api/button/?url=https://www.youtube.com/results?search_query=${cleanQuery}&f=mp3" target="_blank" class="btn-mp3">MP3 ⬇️</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2.5rem;">Error de conexión. Inténtalo de nuevo en unos segundos.</div>';
            }
        }

        // Search Calle 13 by default on initial load
        window.onload = () => {
            document.getElementById('query-input').value = "Calle 13";
            handleSearch({ preventDefault: () => {} });
        };
    </script>
</body>
</html>
